document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nge: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"bc4e96c5-6c7d-443f-a2ef-2e99d1db8d59\"><\u002Fscript>\n<script src=\"9ff94bd5-2e15-43a5-a84f-f55cbaf52666\"><\u002Fscript>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#f4f3f1;color:#161616;font-family:\"Jost\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#161616;text-decoration:underline;text-underline-offset:3px}\na:hover{color:#6d6e71}\n::selection{background:#d9d9d9}\n*,*::before,*::after{box-sizing:border-box}\nhtml,body{overflow-x:hidden}\nimg{max-width:100%}\ninput:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;min-width:0;max-width:100%;min-height:48px;-webkit-appearance:none;appearance:none}\nselect{background-image:linear-gradient(45deg,transparent 50%,#161616 50%),linear-gradient(135deg,#161616 50%,transparent 50%)!important;background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%!important;background-size:5px 5px!important;background-repeat:no-repeat!important;padding-right:40px!important}\ninput[type=file]{max-width:100%;font-size:14px}\ninput[type=checkbox],input[type=radio]{-webkit-appearance:auto;appearance:auto}\ninput:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #161616;outline-offset:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<header style=\"background:#111;color:#fff;border-bottom:2px solid #a7a9ac\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:16px clamp(20px,5vw,32px);display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:20px\">\n    <a href=\"https://stratton.ae\" target=\"_blank\" rel=\"noopener\" aria-label=\"Stratton Advisory website\" style=\"display:block;flex:none;line-height:0\" style-hover=\"opacity:.75\"><img src=\"4976b5c0-0f23-4c4e-b471-5e78226a644a\" alt=\"Stratton Advisory &amp; Brokerage\" style=\"height:clamp(52px,12vw,68px);width:auto;aspect-ratio:1;display:block;flex:none\"><\u002Fa><a href=\"https://www.stratt.ae\" target=\"_blank\" rel=\"noopener\" aria-label=\"Stratt Signature website\" style=\"display:block;max-width:45%;line-height:0\" style-hover=\"opacity:.75\"><img src=\"cb855908-b141-4048-b21b-d0a93cddbca1\" alt=\"Stratt Signature Real Estate\" style=\"height:clamp(26px,7vw,40px);width:auto;max-width:100%;object-fit:contain;display:block\"><\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"background:#111;color:#fff\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(48px,10vw,88px) clamp(20px,5vw,32px) 0;display:grid;grid-template-columns:minmax(0,1fr);gap:48px;align-items:end\">\n    <div style=\"display:flex;flex-direction:column;gap:clamp(20px,4vw,28px);padding-bottom:clamp(48px,10vw,88px)\">\n      <h1 style=\"margin: 0; font-family: 'Cormorant Garamond',serif; font-weight: 500; font-size: clamp(34px,8vw,71px); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; text-transform: uppercase; overflow-wrap: break-word; max-width: 100%\">International Ambassador Program<\u002Fh1>\n      <p style=\"margin: 0; font-size: clamp(14px,2.4vw,17px); line-height: 1.6; color: #cfd0d2; max-width: 580px; font-weight: 300; text-wrap: pretty; text-transform: uppercase\">REPRESENT A DUBAI FAMILY OFFICE AND A SIGNATURE REAL ESTATE HOUSE IN YOUR MARKET.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"#apply\" style=\"display:flex;align-items:center;justify-content:space-between;gap:40px;flex:0 1 280px;min-height:52px;background:#fff;color:#111;text-decoration:none;padding:16px 20px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:500\" style-hover=\"background:#a7a9ac\">Start application <span>↓<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #a7a9ac\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:32px\">\n      <div style=\"padding:clamp(22px,4vw,32px) 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #333\">\n        <div style=\"font-family: 'Cormorant Garamond',serif; font-size: clamp(20px,4vw,25px); text-transform: uppercase\">Stratton Advisory<\u002Fdiv>\n        <div style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#a7a9ac\">Stratton Your Family Office<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:clamp(22px,4vw,32px) 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid #333\">\n        <div style=\"font-family: 'Cormorant Garamond',serif; font-size: clamp(20px,4vw,25px); text-transform: uppercase\">Stratt Signature Real Estate<\u002Fdiv>\n        <div style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#a7a9ac\">Real Estate • Investment • Advisory<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<main id=\"apply\" style=\"flex:1;max-width:1240px;width:100%;box-sizing:border-box;margin:0 auto;padding:clamp(48px,8vw,80px) clamp(20px,5vw,32px) clamp(56px,10vw,96px)\">\n\n<sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"border-top:2px solid #161616;border-bottom:2px solid #161616;padding:clamp(40px,8vw,72px) 0;display:flex;flex-direction:column;gap:20px;max-width:760px\">\n    <div style=\"font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#6d6e71\">Application received<\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,8vw,56px);line-height:1\">Thank you, {{ applicantName }}.<\u002Fh2>\n    <p style=\"margin:0;font-size:17px;line-height:1.65;color:#3a3a3a;text-wrap:pretty\">Your application is under review. We will contact you at {{ applicantEmail }}.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding-top:12px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;background:transparent;color:#161616;border:1px solid #161616;border-radius:0;padding:14px 20px;cursor:pointer;text-align:left\" style-hover=\"background:#e6e5e2\">Submit another application<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column\">\n\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:40px\">\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(36px,4.5vw,56px);line-height:1;max-width:720px\">Application &amp; Registration Form<\u002Fh2>\n    <div style=\"font-size:13px;color:#6d6e71;letter-spacing:.08em\">Fields marked * are required<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 1 -->\n  <section data-screen-label=\"01 Applicant Information\" style=\"display:flex;flex-wrap:wrap;gap:24px 64px;padding:clamp(36px,7vw,56px) 0;border-top:2px solid #161616\">\n    <div style=\"flex:1 1 min(100%,220px);max-width:320px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(40px,8vw,56px);line-height:1;color:#a7a9ac\">01<\u002Fdiv>\n      <h3 style=\"margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600\">Applicant Information<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex:3 1 min(100%,520px);min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px 28px\">\n      <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Full Legal Name *<input name=\"fullName\" required=\"\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Preferred Name<input name=\"preferredName\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Date of Birth *<input type=\"date\" name=\"dob\" required=\"\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:11px 14px\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Nationality *<input name=\"nationality\" required=\"\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Country of Residence *<input name=\"residence\" required=\"\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616 e=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Notable companies, institutions, family offices, investors or professional networks you work with<textarea name=\"notable\" rows=\"3\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 -->\n  <section data-screen-label=\"08 Compliance\" style=\"display:flex;flex-wrap:wrap;gap:24px 64px;padding:clamp(36px,7vw,56px) 0;border-top:2px solid #161616\">\n    <div style=\"flex:1 1 min(100%,220px);max-width:320px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(40px,8vw,56px);line-height:1;color:#a7a9ac\">08<\u002Fdiv>\n      <h3 style=\"margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600\">Compliance &amp; Professional Standards<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex:3 1 min(100%,520px);min-width:0;display:flex;flex-direction:column;gap:24px\">\n      <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3a3a3a;text-wrap:pretty\">As an International Ambassador, you will be expected to maintain the highest standards of professionalism, confidentiality, integrity and compliance when representing Stratton Advisory and Stratt Signature.<\u002Fp>\n      <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding-bottom:10px;border-bottom:1px solid #c9c8c5\">Please confirm *<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;border-top:1px solid #c9c8c5\">\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance1\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I understand that I may only represent services and information officially authorized by Stratton Advisory / Stratt Signature.<\u002Flabel>\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance2\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I will not make unauthorized promises, guarantees, representations or commitments on behalf of either company.<\u002Flabel>\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance3\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I will maintain strict confidentiality regarding clients, prospects, commercial information and business relationships.<\u002Flabel>\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance4\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I understand that client onboarding and acceptance remain subject to the applicable compliance, KYC/AML and internal approval procedures of the relevant company or service provider.<\u002Flabel>\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance5\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I will comply with all applicable laws and regulations in the jurisdictions in which I operate.<\u002Flabel>\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance6\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I will not collect or receive client funds on behalf of Stratton Advisory or Stratt Signature unless expressly authorized in writing.<\u002Flabel>\n        <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px 0;border-bottom:1px solid #c9c8c5\"><input type=\"checkbox\" name=\"compliance7\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I will not use the Stratton Advisory or Stratt Signature name, logo, marketing materials or branding outside the scope authorized by the company.<\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 -->\n  <section data-screen-label=\"09 References\" style=\"display:flex;flex-wrap:wrap;gap:24px 64px;padding:clamp(36px,7vw,56px) 0;border-top:2px solid #161616\">\n    <div style=\"flex:1 1 min(100%,220px);max-width:320px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(40px,8vw,56px);line-height:1;color:#a7a9ac\">09<\u002Fdiv>\n      <h3 style=\"margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600\">References<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex:3 1 min(100%,520px);min-width:0;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding-bottom:10px;border-bottom:1px solid #c9c8c5\">Professional reference<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:24px 28px\">\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Name<input name=\"refName\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Company<input name=\"refCompany\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Position<input name=\"refPosition\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Email<input type=\"email\" name=\"refEmail\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Telephone<input type=\"tel\" name=\"refPhone\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;bord \n        <label style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer;padding:4px 0\"><input type=\"checkbox\" name=\"documents\" value=\"Business Card\" style=\"accent-color:#161616;width:18px;height:18px;margin:1px 0 0;flex:none\">Business Card<\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer;padding:4px 0\"><input type=\"checkbox\" name=\"documents\" value=\"LinkedIn Profile\" style=\"accent-color:#161616;width:18px;height:18px;margin:1px 0 0;flex:none\">LinkedIn Profile<\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer;padding:4px 0\"><input type=\"checkbox\" name=\"documents\" value=\"Professional Licenses / Certifications\" style=\"accent-color:#161616;width:18px;height:18px;margin:1px 0 0;flex:none\">Professional Licenses / Certifications<\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer;padding:4px 0\"><input type=\"checkbox\" name=\"documents\" value=\"References\" style=\"accent-color:#161616;width:18px;height:18px;margin:1px 0 0;flex:none\">References<\u002Flabel>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer;padding:4px 0\"><input type=\"checkbox\" name=\"documents\" value=\"Other Supporting Documents\" style=\"accent-color:#161616;width:18px;height:18px;margin:1px 0 0;flex:none\">Other Supporting Documents<\u002Flabel>\n      <\u002Fdiv>\n      <label style=\"display:flex;flex-direction:column;gap:10px;padding:clamp(16px,4vw,24px);border:1px dashed #8a8b8e;min-width:0;overflow:hidden;background:#fff;cursor:pointer\" style-hover=\"background:#ecebe8\">\n        <span style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600\">Upload files<\u002Fspan>\n        <span style=\"font-size:14px;color:#4a4a4a\">PDF, JPG or PNG. Select multiple files at once.<\u002Fspan>\n        <input type=\"file\" name=\"files\" multiple=\"\" accept=\".pdf,.jpg,.jpeg,.png,.doc,.docx\" sc-camel-on-change=\"{{ onFiles }}\" style=\"font:inherit;font-size:14px\">\n        <span style=\"font-size:14px;color:#161616;overflow-wrap:anywhere\">{{ fileSummary }}<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 11 -->\n  <section data-screen-label=\"11 Declaration &amp; Consent\" style=\"display:flex;flex-wrap:wrap;gap:24px 64px;padding:clamp(36px,7vw,56px) 0;border-top:2px solid #161616\">\n    <div style=\"flex:1 1 min(100%,220px);max-width:320px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(40px,8vw,56px);line-height:1;color:#a7a9ac\">11<\u002Fdiv>\n      <h3 style=\"margin:0;font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600\">Declaration &amp; Consent<\u002Fh3>\n    <\u002Fdiv>\n    <div style=\"flex:3 1 min(100%,520px);min-width:0;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;font-size:16px;line-height:1.65;color:#3a3a3a;text-wrap:pretty\">\n        <p style=\"margin:0\">I hereby confirm that the information provided in this application is true, complete and accurate to the best of my knowledge.<\u002Fp>\n        <p style=\"margin:0\">I understand that submission of this application does not automatically constitute appointment or authorization as an International Ambassador. Appointment is subject to review, due diligence, approval and written confirmation by Stratton Advisory and/or Stratt Signature.<\u002Fp>\n        <p style=\"margin:0\">I agree to uphold the values and reputation of the Stratton brand and to conduct myself with professionalism, integrity, discretion and transparency when introducing clients, business opportunities or services.<\u002Fp>\n        <p style=\"margin:0\">I acknowledge that all client relationships and business opportunities introduced through the Ambassador Program remain subject to the applicable company policies, agreements, compliance requirements and approval procedures.<\u002Fp>\n      <\u002Fdiv>\n      <label style=\"display:flex;gap:14px;align-items:flex-start;font-size:15px;line-height:1.55;cursor:pointer;padding:16px;background:#fff;border:1px solid #161616\"><input type=\"checkbox\" name=\"declaration\" required=\"\" style=\"accent-color:#161616;width:18px;height:18px;margin:2px 0 0;flex:none\">I have read and agree to the declaration and consent above. *<\u002Flabel>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:24px 28px\">\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Applicant Name *<input name=\"declName\" required=\"\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:12px 14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Signature (type full name) *<input name=\"signature\" required=\"\" style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:6px 14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#4a4a4a;font-weight:500\">Date *<input type=\"date\" name=\"declDate\" required=\"\" sc-camel-default-value=\"{{ today }}\" style=\"font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:#161616;background:#fff;border:1px solid #c9c8c5;border-radius:0;padding:11px 14px\"><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"border-top:2px solid #161616;padding-top:40px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:flex-end\">\n    <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n      <p role=\"alert\" style=\"margin:0;flex:1 1 320px;font-size:15px;line-height:1.55;color:#b3261e\">{{ errorText }}<\u002Fp>\n    <\u002Fsc-if>\n    <button type=\"submit\" disabled=\"{{ sending }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:48px;flex:1 1 280px;max-width:420px;min-height:60px;font:inherit;font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;background:#111;color:#fff;border:0;border-radius:0;padding:20px 24px;cursor:pointer;text-align:left\" style-hover=\"background:#3a3a3a\" style-active=\"background:#000\">{{ submitLabel }} <span>→<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fform>\n<\u002Fsc-if>\n<\u002Fmain>\n\n<footer style=\"background:#111;color:#cfd0d2;border-top:2px solid #a7a9ac\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(36px,7vw,48px) clamp(20px,5vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6\">\n      <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a7a9ac\">Address<\u002Fdiv>\n      <div>MSM 2 Building, Office 212, Al Safa First, Sheikh Zayed Road, Dubai, UAE<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6\">\n      <div style=\"font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a7a9ac\">Contact<\u002Fdiv>\n      <a href=\"tel:+97145911633\" style=\"color:#cfd0d2;text-decoration:none\">Landline: 045-911-633<\u002Fa>\n      <a href=\"mailto:info@stratton.ae\" style=\"color:#fff;overflow-wrap:anywhere\">info@stratton.ae<\u002Fa>\n      <div style=\"display:flex;gap:16px\"><a href=\"https://stratton.ae\" style=\"color:#fff\">stratton.ae<\u002Fa><a href=\"https://www.stratt.ae\" style=\"color:#fff\">stratt.ae<\u002Fa><\u002Fdiv>\n      <div style=\"color:#8a8b8e\">TRN: 100501548000003<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;emailjsPublicKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;fFPc-YK2mf6D4gOpP&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;EmailJS&quot;},&quot;emailjsServiceId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;service_plcguuq&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;EmailJS&quot;},&quot;emailjsTemplateId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;template_6l4ztgf&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;EmailJS&quot;},&quot;applicantTemplateId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;template_tckywxj&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;EmailJS&quot;},&quot;toEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;info@stratton.ae&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;EmailJS&quot;}}\">\nclass Component extends DCLogic {\n  state = { submitted: false, sending: false, error: '', name: '', email: '', files: [] };\n  buildMessage(d) {\n    const v = k => { const x = d[k]; return Array.isArray(x) ? x.join(', ') : (x || '-'); };\n    const S = (title, rows) => '\\n== ' + title + ' ==\\n' + rows.map(([l, k]) => l + ': ' + v(k)).join('\\n') + '\\n';\n    return [\n      S('1. APPLICANT INFORMATION', [['Full Legal Name','fullName'],['Preferred Name','preferredName'],['Date of Birth','dob'],['Nationality','nationality'],['Country of Residence','residence'],['City','city'],['Mobile / WhatsApp','mobile'],['Email','email'],['LinkedIn','linkedin'],['Website / Social Media','website'],['Occupation / Position','occupation'],['Company','company'],['Years of Experience','experience']]),\n      S('2. AMBASSADOR MARKET', [['Primary Country','marketCountry'],['City / Region','marketCity'],['Other Countries','otherCountries'],['Languages','languages'],['English Level','englishLevel'],['Other Languages','otherLanguages'],['Established Network','hasNetwork'],['Network Description','networkDescription']]),\n      S('3. PROFESSIONAL BACKGROUND', [['Current Activities','activities'],['Industries','industries'],['Other Industries','industriesOther']]),\n      S('4. SERVICES', [['Stratton Advisory','advisoryServices'],['Advisory Other','advisoryOther'],['Stratt Signature Real Estate','realEstateServices']]),\n      S('5. CLIENT & NETWORK PROFILE', [['Qualified Contacts','contacts'],['Client Profile','clientProfile'],['Client Nationalities / Markets','clientMarkets'],['Introductions per Month','introsPerMonth']]),\n      S('6. AMBASSADOR ACTIVITIES', [['Activities','activitiesType'],['Other Activities','activitiesOther'],['Business Development Plan','businessPlan']]),\n      S('7. INTERNATIONAL PRESENCE', [['Countries with Connections','connectionCountries'],['Networks / Associations','networks'],['Notable Relationships','notable']]),\n      S('8. COMPLIANCE', [['All 7 statements confirmed','compliance1']]),\n      S('9. REFERENCE', [['Name','refName'],['Company','refCompany'],['Position','refPosition'],['Email','refEmail'],['Telephone','refPhone']]),\n      S('10. SUPPORTING DOCUMENTS', [['Documents Available','documents'],['Files Selected','files']]),\n      S('11. DECLARATION', [['Agreed','declaration'],['Applicant Name','declName'],['Signature','signature'],['Date','declDate']])\n    ].join('');\n  }\n  onSubmit = async (e) => {\n    e.preventDefault();\n    if (this.state.sending) return;\n    const fd = new FormData(e.target);\n    const data = {};\n    for (const [k, v] of fd.entries()) {\n      if (v instanceof File) continue;\n      data[k] = data[k] ? [].concat(data[k], v) : v;\n    }\n    data.files = this.state.files.map(f => f.name);\n    const pk = this.props.emailjsPublicKey ?? 'fFPc-YK2mf6D4gOpP';\n    const sid = this.props.emailjsServiceId ?? 'service_plcguuq';\n    const tid = this.props.emailjsTemplateId ?? 'template_6l4ztgf';\n    if (!window.emailjs) { this.setState({ error: 'Email service failed to load. Please check your connection and try again.' }); return; }\n    this.setState({ sending: true, error: '' });\n    const ALL = ['fullName','preferredName','dob','nationality','residence','city','mobile','email','linkedin','website','occupation','company','experience','marketCountry','marketCity','otherCountries','languages','englishLevel','otherLanguages','hasNetwork','networkDescription','activities','industries','industriesOther','advisoryServices','advisoryOther','realEstateServices','contacts','clientProfile','clientMarkets','introsPerMonth','activitiesType','activitiesOther','businessPlan','connectionCountries','networks','notable','compliance1','compliance2','compliance3','compliance4','compliance5','compliance6','compliance7','refName','refCompany','refPosition','refEmail','refPhone','documents','files','declaration','declName','signature','declDate'];\n    const flat = {};\n    ALL.forEach(k => { const x = data[k]; const s = Array.isArray(x) ? x.join(', ') : (x == null ? '' : String(x)); flat[k] = s === 'on' ? 'Confirmed' : (s.trim() || '-'); });\n    try {\n      await window.emailjs.send(sid, tid, {\n        ...flat,\n        to_email: this.props.toEmail ?? 'info@stratton.ae',\n        from_name: data.fullName || '',\n        reply_to: data.email || '',\n        subject: 'Ambassador Application: ' + (data.fullName || '') + ' (' + (data.marketCountry || '') + ')',\n        message: this.buildMessage(data),\n        submitted_at: new Date().toLocaleString('en-GB', { timeZone: 'Asia/Dubai' }) + ' (Dubai)'\n      }, { publicKey: pk });\n      const atid = this.props.applicantTemplateId ?? 'template_tckywxj';\n      if (atid && data.email) {\n        try {\n          await window.emailjs.send(sid, atid, {\n            ...flat,\n            to_email: data.email,\n            to_name: data.preferredName || data.fullName || '',\n            reply_to: this.props.toEmail ?? 'info@stratton.ae',\n            subject: 'We received your Ambassador application',\n            submitted_at: new Date().toLocaleString('en-GB', { timeZone: 'Asia/Dubai' }) + ' (Dubai)'\n          }, { publicKey: pk });\n        } catch (err2) { console.error('Applicant confirmation failed', err2); }\n      }\n      this.setState({ sending: false, submitted: true, name: data.preferredName || data.fullName || '', email: data.email || '' });\n      const el = document.getElementById('apply');\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' });\n    } catch (err) {\n      console.error('EmailJS error', err);\n      this.setState({ sending: false, error: 'Sorry, your application could not be sent. Please try again or email info@stratton.ae.' });\n    }\n  };\n  renderVals() {\n    const n = this.state.files.length;\n    return {\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      applicantName: this.state.name,\n      applicantEmail: this.state.email,\n      today: new Date().toISOString().slice(0, 10),\n      fileSummary: n ? n + ' file' + (n > 1 ? 's' : '') + ' selected: ' + this.state.files.map(f => f.name).join(', ') : '',\n      onFiles: (e) => this.setState({ files: Array.from(e.target.files || []) }),\n      onSubmit: this.onSubmit,\n      sending: this.state.sending,\n      submitLabel: this.state.sending ? 'Sending…' : 'Submit application',\n      hasError: !!this.state.error,\n      errorText: this.state.error,\n      reset: () => this.setState({ submitted: false, files: [], error: '' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
